name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ai_calling_agent_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      PRIMARY_DB_URL: postgresql+psycopg://postgres:postgres@localhost:5432/ai_calling_agent_test
      REDIS_URL: redis://localhost:6379/1
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            backend/requirements-dev.txt
            backend/constraints.txt

      - run: pip install -r requirements-dev.txt -c constraints.txt

      # P2-1: tests/ops needs `age` (backup encryption) and shellcheck. Without them ~43 of the
      # backup / restore / erasure safety tests skip silently (see the skip budget below).
      - name: Install tools the ops tests need
        run: sudo apt-get update -qq && sudo apt-get install -y -qq age shellcheck

      - name: Pinned set is current (constraints.txt)
        run: scripts/constraints.sh check

      - name: Lint (ruff)
        run: ruff check .

      - name: Type check (mypy)
        run: mypy app

      - name: Apply migrations
        run: alembic upgrade head

      - name: Test (pytest)
        run: |
          set -o pipefail
          pytest -q -rfE --junitxml=/tmp/junit.xml 2>&1 | tee /tmp/pytest.log || {
            grep -E '^(FAILED|ERROR)' /tmp/pytest.log | head -20 | while IFS= read -r line; do
              echo "::error title=pytest::${line:0:400}"
            done
            tail -n 40 /tmp/pytest.log | grep -E '(^E  |passed|failed)' | head -15 | while IFS= read -r line; do
              echo "::warning title=pytest-detail::${line:0:400}"
            done
            exit 1
          }

      # P2-1: tests/ops (backup, restore, erasure safety) skip themselves when a tool is
      # missing, which looks like a pass. This fails the build if more than the allowance skip.
      - name: Skip budget (tests/ops)
        run: python scripts/ci_skip_budget.py /tmp/junit.xml --prefix tests.ops --allow 0

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Lint (eslint)
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Test (vitest)
        run: npm test

      - name: Build
        run: npm run build

  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "22"

      # Fails on any pip-audit finding and on high/critical npm findings (production deps)
      # that are not listed, unexpired, in docs/SECURITY-EXCEPTIONS.md.
      - name: Install pip-audit
        run: pip install pip-audit==2.10.1

      - name: Backend (pip-audit)
        run: python ops/ci/audit_gate.py pip --requirements backend/constraints.txt

      - name: Frontend (npm audit --omit=dev)
        run: python ops/ci/audit_gate.py npm --dir frontend
