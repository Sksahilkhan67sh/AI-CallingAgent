# Include from postgresql.conf (include_if_exists = '/etc/postgresql/16/main/backup.conf').
# Enabling archiving changes wal_level / archive_mode, which require a PostgreSQL RESTART
# (archive_command and archive_timeout alone only need a reload).
wal_level = replica
archive_mode = on
# Runs as the postgres OS user; configuration comes from BACKUP_ENV_FILE
# (/etc/ai-calling-agent/backup.env, mode 0600). A non-zero exit makes PostgreSQL keep the
# segment and retry, so pg_wal grows if the destination is down: monitor free space (CP16).
archive_command = '/opt/ai-calling-agent/ops/backup/archive_wal.sh "%p" "%f"'
# Upper bound on the data at risk when the database is busy: RPO target 15 min => 300 s leaves
# room for copy delay. A quiet database archives nothing; schedule the heartbeat in the
# runbook (SELECT pg_logical_emit_message(false, 'backup-heartbeat', 'x')) so freshness stays meaningful.
archive_timeout = 300
# The backup role needs REPLICATION and enough max_wal_senders for pg_basebackup.
max_wal_senders = 4
