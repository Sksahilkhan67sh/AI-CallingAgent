services:
  db:
    image: postgres:16
    # P2-4: explicit on purpose (the image default is also 100). Must cover the sum in
    # docs/hardening-p2/CONNECTION-BUDGET.md plus its reserve; a test checks it.
    command: ["postgres", "-c", "max_connections=100"]
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=ai_calling_agent
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    # P1-3: AOF with everysec (a crash loses at most about one second of writes), password
    # required, data on a named volume. The port is NOT published to the host: only services on
    # the compose network can reach it. REDIS_PASSWORD has no default on purpose.
    command:
      - sh
      - -c
      - exec redis-server --appendonly yes --appendfsync everysec --requirepass "$$REDIS_PASSWORD"
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:?set REDIS_PASSWORD (see .env.example)}
      - REDISCLI_AUTH=${REDIS_PASSWORD:?set REDIS_PASSWORD (see .env.example)}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 5

  # P2-5: the only place that runs migrations. Runs once and exits; every service that touches the
  # schema waits for it to finish successfully. `restart: "no"` so a failed migration is visible
  # instead of looping. Alembic takes an advisory lock, so even a second run is safe.
  migrate:
    build: ./backend
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    env_file:
      - ./backend/.env.example
    environment:
      - LOG_LEVEL=debug
      - PRIMARY_DB_URL=postgresql+psycopg://postgres:postgres@db:5432/ai_calling_agent
    depends_on:
      db:
        condition: service_healthy

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env.example
    environment:
      - LOG_LEVEL=debug
      - PRIMARY_DB_URL=postgresql+psycopg://postgres:postgres@db:5432/ai_calling_agent
      - REDIS_URL=redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD}@redis:6379/0
    # P2-6: docker stop sends SIGTERM then kills after this; it must outlast the app's own
    # graceful shutdown (API: WEB_GRACEFUL_SHUTDOWN_SECONDS, workers: the job deadline).
    stop_grace_period: 40s
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  worker:
    build: ./backend
    command: ["python", "-m", "app.worker"]
    env_file:
      - ./backend/.env.example
    environment:
      - LOG_LEVEL=debug
      - DB_ROLE=worker
      - PRIMARY_DB_URL=postgresql+psycopg://postgres:postgres@db:5432/ai_calling_agent
      - REDIS_URL=redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD}@redis:6379/0
    # P2-6: docker stop sends SIGTERM then kills after this; it must outlast the app's own
    # graceful shutdown (API: WEB_GRACEFUL_SHUTDOWN_SECONDS, workers: the job deadline).
    stop_grace_period: 40s
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  analysis-worker:
    build: ./backend
    command: ["python", "-m", "app.analysis_worker"]
    env_file:
      - ./backend/.env.example
    environment:
      - LOG_LEVEL=debug
      - DB_ROLE=analysis
      - PRIMARY_DB_URL=postgresql+psycopg://postgres:postgres@db:5432/ai_calling_agent
      - REDIS_URL=redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD}@redis:6379/0
    # P2-6: docker stop sends SIGTERM then kills after this; it must outlast the app's own
    # graceful shutdown (API: WEB_GRACEFUL_SHUTDOWN_SECONDS, workers: the job deadline).
    stop_grace_period: 40s
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  sweeper:
    build: ./backend
    command: ["python", "-m", "app.sweeper"]
    env_file:
      - ./backend/.env.example
    environment:
      - LOG_LEVEL=debug
      - DB_ROLE=sweeper
      - PRIMARY_DB_URL=postgresql+psycopg://postgres:postgres@db:5432/ai_calling_agent
      - REDIS_URL=redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD}@redis:6379/0
    # P2-6: docker stop sends SIGTERM then kills after this; it must outlast the app's own
    # graceful shutdown (API: WEB_GRACEFUL_SHUTDOWN_SECONDS, workers: the job deadline).
    stop_grace_period: 20s
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_BASE_URL=http://localhost:8000
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
